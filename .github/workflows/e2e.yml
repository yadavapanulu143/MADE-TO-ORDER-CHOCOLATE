name: End-to-end journey

# Boots the whole stack through docker compose and drives `scripts/e2e-journey.py` against it over
# the gateway. This is the one check that exercises every service together — registration and OTP
# verification, catalogue, checkout, the verified-capture saga, the kitchen, delivery, notifications,
# invoices and the seller's reports and exports — which the per-service `*IT` suites each prove in
# isolation but never in one running system. It is deliberately separate from the backend job: it
# needs the containers, so it is slower, and a failure here means an integration seam rather than a
# unit regression.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'scripts/e2e-journey.py'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose*.yml'
      - 'scripts/e2e-journey.py'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journey:
    name: Customer and seller journey
    runs-on: ubuntu-latest
    # Building eight service images and two frontends, then driving the journey, is the long pole.
    timeout-minutes: 60

    env:
      # A development-only administrator, created once by the identity bootstrap on first start so
      # the seller stages can run. The values are throwaway and never reused outside this job.
      CHOCO_ADMIN_BOOTSTRAP_EMAIL: e2e-admin@choco.test
      CHOCO_ADMIN_BOOTSTRAP_PASSWORD: 'E2e!AdminPass123'
      CHOCO_ADMIN_BOOTSTRAP_NAME: E2E Administrator
      # The mobile OTP has no SMS provider in the sandbox, so it is written to the identity log and
      # the harness reads it from `docker logs`. This must never be true outside a test machine.
      CHOCO_LOG_OTP: 'true'
      E2E_ADMIN_EMAIL: e2e-admin@choco.test
      E2E_ADMIN_PASSWORD: 'E2e!AdminPass123'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The identity service signs tokens with this key; without it the service generates an
      # ephemeral one, which still works but logs a loud warning. Generating it keeps the run close
      # to a real deployment.
      - name: Generate the JWT signing key
        run: scripts/generate-jwt-keys.sh secrets

      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build

      # `up -d` returns as soon as the containers are created, and the gateway is declared healthy
      # once its own dependencies are up — but the journey also drives the order, payment,
      # fulfilment, notification and reporting services, which start in parallel and may still be
      # booting. Wait for every service to report healthy, not just the gateway.
      - name: Wait for the stack to be healthy
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.app.yml"
          for attempt in $(seq 1 60); do
            total=$($compose ps --format '{{.Service}}' | grep -c . || true)
            healthy=$(docker ps --format '{{.Names}} {{.Status}}' | grep '^choco-' | grep -c '(healthy)' || true)
            echo "attempt ${attempt}: ${healthy}/${total} services healthy"
            if [ "$total" -gt 0 ] && [ "$healthy" -ge "$total" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "the stack did not become healthy in time" >&2
          $compose ps
          exit 1

      - name: Run the end-to-end journey
        run: python3 scripts/e2e-journey.py

      # Always leave the logs behind, pass or fail: a failure here is usually visible only in a
      # service log, not in the assertion that tripped.
      - name: Dump service logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color --tail 400

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v
