server:
  port: 8082
  shutdown: graceful
  # Uploaded images are held in memory by the multipart parser before validation. The cap keeps one
  # request from exhausting the heap; it must stay at or below the domain's own size limit so a file
  # that passes the container limit can still be rejected with a clear message by the domain.
  tomcat:
    max-http-form-post-size: 6MB

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CHOCO_CATALOG_DB_URL:jdbc:postgresql://localhost:5432/choco_catalog}
    username: ${CHOCO_CATALOG_DB_USER:choco_catalog}
    password: ${CHOCO_CATALOG_DB_PASSWORD:choco_catalog_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate validates that the entities match it and never alters it:
      # an automatic schema update in production can drop a column and its data.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Batch-fetch lazy child collections so loading a page of products costs a bounded number of
        # queries rather than one per product.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${CHOCO_REDIS_HOST:localhost}
      port: ${CHOCO_REDIS_PORT:6379}
      password: ${CHOCO_REDIS_PASSWORD:choco_redis_pw}
      timeout: 2s
  rabbitmq:
    host: ${CHOCO_RABBITMQ_HOST:localhost}
    port: ${CHOCO_RABBITMQ_PORT:5672}
    username: ${CHOCO_RABBITMQ_USER:choco}
    password: ${CHOCO_RABBITMQ_PASSWORD:choco_rabbit_pw}

choco:
  security:
    issuer: choco-identity
    # Unauthenticated paths for this service only. A customer browses the catalogue and reads the
    # published policies before signing in, so those reads are public; every write and every
    # administrative path stays authenticated. Widening this list is a visible change in this file.
    public-paths:
      - /api/v1/products
      - /api/v1/products/**
      - /api/v1/catalog/images/**
      - /api/v1/settings
    jwk-set-uri: ${CHOCO_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CHOCO_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  catalog:
    image-storage:
      # A mounted volume in a deployment; a directory under the working directory locally. The
      # container writes here, so it must be a writable path.
      root: ${CHOCO_CATALOG_IMAGE_ROOT:./data/catalog-images}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${CHOCO_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${CHOCO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.choco: ${CHOCO_LOG_LEVEL:INFO}
