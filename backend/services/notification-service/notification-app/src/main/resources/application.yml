server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    url: ${CHOCO_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/choco_notification}
    username: ${CHOCO_NOTIFICATION_DB_USER:choco_notification}
    password: ${CHOCO_NOTIFICATION_DB_PASSWORD:choco_notification_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate validates that the entities match it and never alters it:
      # an automatic schema update in production can drop a column and its data.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${CHOCO_REDIS_HOST:localhost}
      port: ${CHOCO_REDIS_PORT:6379}
      password: ${CHOCO_REDIS_PASSWORD:choco_redis_pw}
      timeout: 2s
  rabbitmq:
    host: ${CHOCO_RABBITMQ_HOST:localhost}
    port: ${CHOCO_RABBITMQ_PORT:5672}
    username: ${CHOCO_RABBITMQ_USER:choco}
    password: ${CHOCO_RABBITMQ_PASSWORD:choco_rabbit_pw}
    listener:
      simple:
        # Acknowledge only after the handler returns, so a crash mid-handler redelivers the event. The
        # handlers are idempotent through the dedupe key, so a redelivery is safe.
        acknowledge-mode: auto
        # One message at a time per consumer. Sending is a network call, and prefetching a batch would
        # have several provider conversations in flight for no benefit — the work is I/O-bound, not
        # throughput-bound.
        prefetch: 1
        # Reject rather than requeue once the in-memory retries are exhausted, so a poison message
        # lands in the dead-letter queue instead of being redelivered forever in a tight loop.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mail:
    host: ${CHOCO_SMTP_HOST:localhost}
    port: ${CHOCO_SMTP_PORT:1025}
    username: ${CHOCO_SMTP_USER:}
    password: ${CHOCO_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${CHOCO_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${CHOCO_SMTP_TLS:false}
      # A delivery is a network call on the consumer's thread; a bounded timeout keeps one slow mail
      # server from stalling the whole queue.
      mail.smtp.connectiontimeout: ${CHOCO_SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${CHOCO_SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${CHOCO_SMTP_WRITE_TIMEOUT_MS:5000}

choco:
  security:
    issuer: choco-identity
    # Every path in this service is either a RabbitMQ consumer (not HTTP) or an administrative
    # endpoint, so nothing is public. The health probes are the exception, handled by the actuator.
    public-paths: []
    jwk-set-uri: ${CHOCO_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CHOCO_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  notifications:
    # The sender address on every email. Must be an address the configured SMTP server is allowed to
    # send as, or providers will reject the message.
    from: ${CHOCO_NOTIFICATIONS_FROM:noreply@choco.example}
    seller:
      # Where the seller receives administrative alerts (a refund request, a dispute, a low-stock
      # warning). Left blank, those messages are skipped with a warning rather than failing a
      # customer's message; configure both before relying on seller alerts.
      email: ${CHOCO_SELLER_EMAIL:}
      mobile: ${CHOCO_SELLER_MOBILE:}
    sms:
      # No SMS provider is selected. Until a gateway URL is set, SMS sends are logged and reported as
      # sent, so a development environment works end to end; a warning is logged on every send.
      gateway-url: ${CHOCO_SMS_GATEWAY_URL:}
      api-key: ${CHOCO_SMS_API_KEY:}
      sender-id: ${CHOCO_SMS_SENDER_ID:}
      timeout-ms: ${CHOCO_SMS_TIMEOUT_MS:5000}
    retry:
      enabled: ${CHOCO_NOTIFICATION_RETRY_ENABLED:true}
      interval-ms: ${CHOCO_NOTIFICATION_RETRY_INTERVAL_MS:30000}
      # How many times a message is attempted before it is dead-lettered. Small on purpose: a message
      # that has failed several times is more likely undeliverable than momentarily unlucky.
      max-attempts: ${CHOCO_NOTIFICATION_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${CHOCO_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${CHOCO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.choco: ${CHOCO_LOG_LEVEL:INFO}
