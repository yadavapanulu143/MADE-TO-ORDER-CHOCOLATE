server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${CHOCO_ORDER_DB_URL:jdbc:postgresql://localhost:5432/choco_order}
    username: ${CHOCO_ORDER_DB_USER:choco_order}
    password: ${CHOCO_ORDER_DB_PASSWORD:choco_order_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate validates that the entities match it and never alters it:
      # an automatic schema update in production can drop a column and its data.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Batch-fetch lazy child collections so loading a page of orders costs a bounded number of
        # queries rather than one per order.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${CHOCO_REDIS_HOST:localhost}
      port: ${CHOCO_REDIS_PORT:6379}
      password: ${CHOCO_REDIS_PASSWORD:choco_redis_pw}
      timeout: 2s
  rabbitmq:
    host: ${CHOCO_RABBITMQ_HOST:localhost}
    port: ${CHOCO_RABBITMQ_PORT:5672}
    username: ${CHOCO_RABBITMQ_USER:choco}
    password: ${CHOCO_RABBITMQ_PASSWORD:choco_rabbit_pw}

choco:
  security:
    issuer: choco-identity
    # The order service has no public endpoints. A cart, an order and a delivery address are all the
    # signed-in customer's own data, so every path requires a token; the payment webhook path is the
    # one deliberate exception and is added when the payment listener is implemented.
    public-paths: []
    jwk-set-uri: ${CHOCO_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  cors:
    allowed-origins: ${CHOCO_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  order:
    downstream:
      # The services the order service calls synchronously during cart and checkout. A missing address
      # fails at startup rather than at the first checkout.
      catalog: ${CHOCO_CATALOG_URI:http://localhost:8082}
      identity: ${CHOCO_IDENTITY_URI:http://localhost:8081}
      fulfilment: ${CHOCO_FULFILMENT_URI:http://localhost:8085}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${CHOCO_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${CHOCO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.choco: ${CHOCO_LOG_LEVEL:INFO}
