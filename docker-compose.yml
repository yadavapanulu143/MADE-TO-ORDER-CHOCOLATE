# ---------------------------------------------------------------------------
# Local development stack.
#
# Start everything:      docker compose up -d
# Start only the infra:  docker compose up -d postgres redis rabbitmq
# Stop:                  docker compose down
# Wipe all data:         docker compose down -v
#
# Service ports are fixed (not ephemeral) so that application.yml defaults and the
# documented local setup stay in sync. Override with .env if they clash.
# ---------------------------------------------------------------------------

name: choco

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: choco-postgres
    environment:
      POSTGRES_USER: choco_root
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-choco_root_pw}
      POSTGRES_DB: postgres
      # Deterministic collation keeps ORDER BY stable across environments.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choco_root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [choco-net]

  redis:
    image: redis:7.4-alpine
    container_name: choco-redis
    # Password-protected and append-only so cached OTP counters survive a restart.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-choco_redis_pw}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-choco_redis_pw} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [choco-net]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: choco-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-choco}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-choco_rabbit_pw}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [choco-net]

  # ---- Observability (optional locally; started by the `observability` profile) ----

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: choco-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    profiles: [observability]
    networks: [choco-net]

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: choco-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles: [observability]
    networks: [choco-net]

  grafana:
    image: grafana/grafana:12.2.1
    container_name: choco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-choco_grafana_pw}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    profiles: [observability]
    networks: [choco-net]

  loki:
    image: grafana/loki:3.6.3
    container_name: choco-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles: [observability]
    networks: [choco-net]

  # Tempo stores the traces the collector forwards, so Grafana can show a slow request end to end.
  tempo:
    image: grafana/tempo:2.9.0
    container_name: choco-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    profiles: [observability]
    networks: [choco-net]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  choco-net:
    driver: bridge
