global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

# Alert rules live beside this file and are mounted by compose. Where the alerts are routed
# (Alertmanager, Slack, email) is a deployment decision, not committed here.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Each service exposes Actuator's Prometheus endpoint. When services run in
  # Compose, replace host.docker.internal with the service name and container port.
  - job_name: choco-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # api-gateway
          - 'host.docker.internal:8081'   # identity-service
          - 'host.docker.internal:8082'   # catalog-service
          - 'host.docker.internal:8083'   # order-service
          - 'host.docker.internal:8084'   # payment-service
          - 'host.docker.internal:8085'   # fulfilment-service
          - 'host.docker.internal:8086'   # notification-service
          - 'host.docker.internal:8087'   # reporting-service
        labels:
          platform: choco
