# Single-binary Tempo for local development. Traces are kept in memory and flushed
# to the local filesystem; a real deployment uses object storage.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      version: vParquet4

compactor:
  compaction:
    block_retention: 24h
